server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: member-system
  profiles:
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: true
    table: flyway_schema_history
  datasource:
    hikari:
      pool-name: MemberHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  threads:
    virtual:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.company.member.modules.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'NULL'
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: not_null
      insert-strategy: not_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true

logging:
  level:
    root: INFO
    com.company.member: INFO
    com.company.member.modules: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%thread] [%X{traceId:-}] %cyan(%logger{36}) - %msg%n"

# ============ 业务配置 ============
member:
  # JWT：生产环境必须通过环境变量 MEMBER_JWT_SECRET 覆盖
  jwt:
    secret: ${MEMBER_JWT_SECRET:dev-only-secret-key-please-change-it-in-production-32bytes}
    access-ttl: 7200
    refresh-ttl: 604800
  # 缓存：local（Caffeine，单机零依赖） / redis（多实例）
  cache:
    type: ${MEMBER_CACHE_TYPE:local}
    local:
      max-size: 100000
      expire-minutes: 30
  # 支付（预留：小程序在线支付）
  pay:
    mock-enabled: ${MEMBER_PAY_MOCK:true}
    wechat:
      enabled: false
      mch-id: ${WXPAY_MCHID:}
      app-id: ${WXPAY_APPID:}
      api-v3-key: ${WXPAY_API_V3_KEY:}
      private-key-path: ${WXPAY_PRIVATE_KEY_PATH:}
      cert-serial-no: ${WXPAY_CERT_SERIAL_NO:}
      platform-cert-path: ${WXPAY_PLATFORM_CERT_PATH:}
      auto-download-platform-cert: true
  # 微信小程序
  wechat:
    app-id: ${WX_APPID:}
    app-secret: ${WX_SECRET:}
    mock-login: ${WX_MOCK_LOGIN:false}
    subscribe-enabled: true
  # 文件存储
  storage:
    type: ${MEMBER_STORAGE_TYPE:local}
    local-path: ${MEMBER_STORAGE_PATH:./data/files}
    url-prefix: /files
  # 导入导出
  excel:
    max-rows: 20000

---
# ============ 本地开发（本机 MySQL 直连，无需 Docker/Redis） ============
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/member_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3s
      repositories:
        enabled: false

member:
  cache:
    type: local
  pay:
    mock-enabled: true

# 本机无 Redis：关闭 Redis 健康检查，避免 /actuator/health 误报 DOWN
management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.company.member: DEBUG

---
# ============ 测试环境 ============
spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:member_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:member_app}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

member:
  cache:
    type: redis
  pay:
    mock-enabled: true

---
# ============ 生产环境 ============
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:member_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  flyway:
    clean-disabled: true

member:
  cache:
    type: redis
  pay:
    mock-enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.company.member: INFO
  file:
    name: /var/log/member/member-api.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 5GB
